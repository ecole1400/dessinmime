<style>
:root{--ink:#111;--purple:#886ac4;--violet:#6f3abc;--yellow:#fdde73;--pink:#ff9ea2;--lav:#ece5f7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#fff;color:var(--ink);font-family:"Archivo",Arial,sans-serif;font-stretch:125%;font-weight:800;text-transform:uppercase;padding:20px 16px 40px;line-height:1.2}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px}
.letter{flex:none;width:72px;height:72px;background:var(--purple);color:#fff;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter small{font-size:10px;letter-spacing:1px}.letter b{font-size:46px;line-height:.9;font-weight:900}
h1{flex:1;margin:0;font-size:clamp(26px,7vw,44px);font-weight:900;line-height:1}
.logo{width:96px;flex:none;align-self:flex-start}
.band{background:var(--purple);padding:12px 14px;text-align:center;font-size:15px}
a.btn{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);border:4px solid var(--ink);padding:18px;background:#fff;box-shadow:6px 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
a.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
a.btn:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
a.btn .ic{flex:none;width:64px;height:64px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
a.btn.site .ic{background:var(--yellow)}
a.btn.app .ic{background:var(--pink)}
a.btn b{display:block;font-size:24px;font-weight:900}
a.btn span{font-size:13px;color:#444}
.foot{font-size:11px;color:#555;text-align:center;text-transform:none;font-weight:600}
</style>
</head>
